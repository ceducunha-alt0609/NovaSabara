name: NovaSabara precision integrity patch
on:
  push:
    paths:
      - 'novasabara_patch_precision.py'
      - '.github/workflows/novasabara-precision-patch.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python novasabara_patch_precision.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Fix NovaSabara precision scenarios and enrollment goals'
          git push
