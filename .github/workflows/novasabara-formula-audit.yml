name: NovaSabara formula audit
on:
  push:
    paths:
      - 'novasabara_formula_scan.py'
      - '.github/workflows/novasabara-formula-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python novasabara_formula_scan.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add novasabara_formula_findings.txt
          git diff --cached --quiet || git commit -m 'Generate NovaSabara formula findings'
          git push
