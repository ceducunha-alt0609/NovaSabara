name: NovaSabara financial semantics patch
on:
  push:
    paths:
      - 'novasabara_patch_financial_semantics.py'
      - '.github/workflows/novasabara-financial-semantics.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python novasabara_patch_financial_semantics.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Align NovaSabara financial results and labels'
          git push
